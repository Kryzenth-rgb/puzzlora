name: Compilation Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier Android
        run: flutter create --platforms=android --org com.puzzlora --project-name puzzlora .

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler l'APK de test
        run: flutter build apk --debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzlora-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
